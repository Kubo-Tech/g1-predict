[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "g1-predict"
version = "0.1.0"
description = "JRA G1レースの傾向分析・予想・回顧記事を生成し、はてなブログへ投稿するツール"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Kubo-Tech"},
]
keywords = ["keiba", "horse-racing", "g1", "prediction", "hatena-blog"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
]

dependencies = [
    # keiba-data-interface / mykeibadb-python はPyPIに無いkeiba-domainを要求するため、
    # keiba-domain自身もgit参照で明示する。書かないと依存解決に失敗する。
    "keiba-domain @ git+https://github.com/KeibaAI-developer/keiba-domain.git",
    "keiba-data-interface @ git+https://github.com/KeibaAI-developer/keiba-data-interface.git",
    "mykeibadb-python @ git+https://github.com/KeibaAI-developer/mykeibadb-python.git@develop",
    "openpyxl>=3.1.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    # 静的解析の結果を左右するため、mypyと型情報のバージョンは固定する。
    "mypy==1.17.1",
    "pandas-stubs==2.3.2.250827",
    "types-PyYAML==6.0.12.20250915",
    "types-requests==2.32.4.20250913",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["g1_predict*"]

[tool.ruff]
line-length = 100
target-version = "py312"

# DOCルール（pydoclint相当）がpreview扱いのため有効化する。
preview = true

[tool.ruff.lint]
select = ["E", "W", "F", "N", "D", "I", "DOC"]
ignore = [
    "E203",   # `:` の前のスペース（Black互換）
    "D105",   # マジックメソッドのdocstring
    "D107",   # `__init__` のdocstring
    "D403",   # docstring先頭の大文字化（日本語docstringのため不要）
    "D415",   # docstring末尾のピリオド（日本語docstringのため不要）
    "DOC201", # Returns未記載（自明な場合は省略可）
    "DOC502", # Raisesに実際には送出しない例外を記載
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
# 標準ライブラリの `test` パッケージと同名のため、サードパーティ扱いにさせない
extra-standard-library = ["test"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_any_unimported = false
disallow_any_generics = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
check_untyped_defs = true
strict_optional = true
strict_equality = true
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true
disable_error_code = ["attr-defined", "import-untyped"]

[[tool.mypy.overrides]]
module = "test.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
]
markers = [
    "unit: 単体テスト",
    "integration: 結合テスト",
    "slow: 実行に時間がかかるテスト",
]
