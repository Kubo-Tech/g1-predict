name: 前走
description: 出走馬の前走に関する傾向
items:
  前走レース:
    source: {type: prev_race_name, overseas_label: 海外}
    rows:
      type: dynamic
      top_n: 5
      always_include_grades: ["A", "B", "C"]
  前走着順:
    source: {type: prev_race_finish}
    rows: &prev_finish_rows
      type: fixed
      items:
        - {label: "1着", op: "==", value: 1}
        - {label: "2着", op: "==", value: 2}
        - {label: "3着", op: "==", value: 3}
        - {label: "4着", op: "==", value: 4}
        - {label: "5着", op: "==", value: 5}
        - {label: "6-9着", op: "in", value: [6, 7, 8, 9]}
        - {label: "10着以下", op: ">=", value: 10}
  前走距離:
    source: {type: prev_distance_diff}
    rows:
      type: fixed
      items:
        - {label: "距離延長", op: "<", value: 0}
        - {label: "同距離", op: "==", value: 0}
        - {label: "距離短縮", op: ">", value: 0}
  前走クラス:
    source: {type: prev_race_class}
    rows:
      type: fixed
      hide_empty: true
      items:
        - {label: "G1", op: "==", value: "G1"}
        - {label: "G2", op: "==", value: "G2"}
        - {label: "G3", op: "==", value: "G3"}
        - {label: "リステッド", op: "==", value: "リステッド"}
        - {label: "オープン", op: "==", value: "オープン"}
        - {label: "3勝クラス", op: "==", value: "3勝クラス"}
        - {label: "2勝クラス", op: "==", value: "2勝クラス"}
        - {label: "1勝クラス", op: "==", value: "1勝クラス"}
        - {label: "未勝利", op: "==", value: "未勝利"}
        - {label: "新馬", op: "==", value: "新馬"}
        - {label: "地方", op: "==", value: "地方"}
        - {label: "海外", op: "==", value: "海外"}
  前走G1着順:
    source: {type: prev_race_finish_by_grade, grade_codes: ["A"]}
    rows: *prev_finish_rows
  前走G2着順:
    source: {type: prev_race_finish_by_grade, grade_codes: ["B"]}
    rows: *prev_finish_rows
  前走G3着順:
    source: {type: prev_race_finish_by_grade, grade_codes: ["C"]}
    rows: *prev_finish_rows
  前走リステッド着順:
    source: {type: prev_race_finish_by_class, race_class: リステッド}
    rows: *prev_finish_rows
  前走オープン着順:
    source: {type: prev_race_finish_by_class, race_class: オープン}
    rows: *prev_finish_rows
  前走3勝クラス着順:
    source: {type: prev_race_finish_by_class, race_class: 3勝クラス}
    rows: *prev_finish_rows
  前走2勝クラス着順:
    source: {type: prev_race_finish_by_class, race_class: 2勝クラス}
    rows: *prev_finish_rows
  前走1勝クラス着順:
    source: {type: prev_race_finish_by_class, race_class: 1勝クラス}
    rows: *prev_finish_rows
  前走未勝利着順:
    source: {type: prev_race_finish_by_class, race_class: 未勝利}
    rows: *prev_finish_rows
  前走新馬着順:
    source: {type: prev_race_finish_by_class, race_class: 新馬}
    rows: *prev_finish_rows
  前走非重賞着順:
    source: {type: prev_race_finish_by_grade, exclude_grade_codes: ["A", "B", "C"]}
    rows: *prev_finish_rows
