name: 同年/前年レース実績
items:
  高松宮記念着順:
    column_name: 着順
    source:
      type: tokubetsu_race_finish
      tokubetsu_kyoso_bango: "0019"
      year_offset: 0
    rows:
      type: fixed
      items:
        - {label: "3着以内", op: "<=", value: 3}
        - {label: "4着以内", op: "<=", value: 4}
        - {label: "5着以内", op: "<=", value: 5}
        - {label: "6着以下", op: ">=", value: 6}
  桜花賞着順:
    column_name: 着順
    source:
      type: tokubetsu_race_finish
      tokubetsu_kyoso_bango: "0001"
      year_offset: 0
    rows: &classic_finish_rows
      type: fixed
      items:
        - {label: "1着", op: "==", value: 1}
        - {label: "2着", op: "==", value: 2}
        - {label: "3着", op: "==", value: 3}
        - {label: "4着", op: "==", value: 4}
        - {label: "5着", op: "==", value: 5}
        - {label: "6-9着", op: "in", value: [6, 7, 8, 9]}
        - {label: "10着以下", op: ">=", value: 10}
  オークス着順:
    column_name: 着順
    source:
      type: tokubetsu_race_finish
      tokubetsu_kyoso_bango: "0003"
      year_offset: 0
    rows: *classic_finish_rows
  ローズS着順:
    column_name: 着順
    source:
      type: tokubetsu_race_finish
      tokubetsu_kyoso_bango: "0052"
      year_offset: 0
    rows: *classic_finish_rows
  紫苑S着順:
    column_name: 着順
    source:
      type: tokubetsu_race_finish
      tokubetsu_kyoso_bango: "0208"
      year_offset: 0
    rows: *classic_finish_rows
