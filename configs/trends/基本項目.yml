name: 基本項目
items:
  人気:
    hide_entry_column: true
    source: {type: popularity}
    rows:
      type: fixed
      items:
        - {label: "1人気", op: "==", value: 1}
        - {label: "2人気", op: "==", value: 2}
        - {label: "3人気", op: "==", value: 3}
        - {label: "4-6人気", op: "in", value: [4, 5, 6]}
        - {label: "7-9人気", op: "in", value: [7, 8, 9]}
        - {label: "10人気以下", op: ">=", value: 10}
  枠順:
    conditionable: true
    hide_entry_column: true
    source: {type: gate_number}
    rows:
      type: fixed
      items:
        - {label: "1枠", op: "==", value: 1}
        - {label: "2枠", op: "==", value: 2}
        - {label: "3枠", op: "==", value: 3}
        - {label: "4枠", op: "==", value: 4}
        - {label: "5枠", op: "==", value: 5}
        - {label: "6枠", op: "==", value: 6}
        - {label: "7枠", op: "==", value: 7}
        - {label: "8枠", op: "==", value: 8}
  脚質:
    conditionable: true
    uses_race_result: true
    source: {type: running_style}
    rows: &running_style_rows
      type: fixed
      items:
        - {label: "逃げ", op: "==", value: "1"}
        - {label: "先行", op: "==", value: "2"}
        - {label: "差し", op: "==", value: "3"}
        - {label: "追込", op: "==", value: "4"}
  前走脚質:
    conditionable: true
    source: {type: prev_race_col, column: kyakushitsu_hantei}
    rows: *running_style_rows
  4角通過順位:
    column_name: 通過
    conditionable: true
    uses_race_result: true
    source: {type: corner4_juni}
    rows: &corner4_rows
      type: fixed
      items:
        - {label: "1番手", op: "==", value: 1}
        - {label: "2-4番手", op: between, value: [2, 4]}
        - {label: "5-7番手", op: between, value: [5, 7]}
        - {label: "8-10番手", op: between, value: [8, 10]}
        - {label: "11番手以下", op: ">=", value: 11}
  前走4角通過順位:
    column_name: 通過
    conditionable: true
    source: {type: prev_corner4_juni}
    rows: *corner4_rows
  上がり3F順位:
    column_name: 後3F順位
    conditionable: true
    uses_race_result: true
    source: {type: agari_3f_rank}
    rows: &agari_3f_rank_rows
      type: fixed
      items:
        - {label: "1位", op: "==", value: 1}
        - {label: "2位", op: "==", value: 2}
        - {label: "3位", op: "==", value: 3}
        - {label: "4位以下", op: ">=", value: 4}
  前走上がり3F順位:
    column_name: 前走後3F順位
    conditionable: true
    source: {type: prev_race_col, column: kohan_3f_jun}
    rows: *agari_3f_rank_rows
  所属:
    source: {type: affiliation}
    rows:
      type: fixed
      hide_empty: true
      items:
        - {label: "美浦", op: "==", value: 1}
        - {label: "栗東", op: "==", value: 2}
        - {label: "地方", op: "==", value: 3}
        - {label: "海外", op: "==", value: 4}
  馬齢:
    source: {type: horse_age}
    rows:
      type: fixed
      items:
        - {label: "3歳", op: "==", value: 3}
        - {label: "4歳", op: "==", value: 4}
        - {label: "5歳", op: "==", value: 5}
        - {label: "6歳", op: "==", value: 6}
        - {label: "7歳以上", op: ">=", value: 7}
  性別:
    source: {type: sex}
    rows:
      type: fixed
      hide_empty: true
      items:
        - {label: "牡", op: "==", value: 1}
        - {label: "牝", op: "==", value: 2}
        - {label: "セン", op: "==", value: 3}
  馬体重:
    source: {type: horse_weight}
    rows:
      type: fixed
      items:
        - {label: "459kg以下", op: "<=", value: 459}
        - {label: "460-479kg", op: between, value: [460, 479]}
        - {label: "480-499kg", op: between, value: [480, 499]}
        - {label: "500-519kg", op: between, value: [500, 519]}
        - {label: "520kg以上", op: ">=", value: 520}
  輸送:
    source: {type: transport}
    rows:
      type: fixed
      items:
        - {label: "輸送なし", op: "==", value: "輸送なし"}
        - {label: "輸送あり", op: "==", value: "輸送あり"}
        - {label: "初輸送", op: "==", value: "初輸送"}
  間隔:
    source: {type: prev_interval_weeks}
    rows:
      type: fixed
      hide_empty: true
      items:
        - {label: "連闘", op: "==", value: 0}
        - {label: "中1-2週", op: between, value: [1, 2]}
        - {label: "中3週", op: "==", value: 3}
        - {label: "中4-5週", op: between, value: [4, 5]}
        - {label: "中6-9週", op: between, value: [6, 9]}
        - {label: "中10週以上", op: ">=", value: 10}
