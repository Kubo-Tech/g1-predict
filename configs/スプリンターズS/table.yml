出走馬:
  - name: 枠勝率
    source:
      type: waku_stat
      stat: win_rate
      keibajo_code: "06"
      track: shiba
      kyori: 1200
      years: 5
      week: 2
    color_rules:
      - condition:
          op: ">="
          value: 0.125
        color: yellow

  - name: 枠複勝率
    source:
      type: waku_stat
      stat: top3_rate
      keibajo_code: "06"
      track: shiba
      kyori: 1200
      years: 5
      week: 2
    color_rules:
      - condition:
          op: ">="
          value: 0.375
        color: yellow

  - name: 前走脚質
    source:
      type: recent_umagoto_field
      field: kyakushitsu
    color_rules:
      - condition:
          op: in
          value: ["逃", "先"]
        color: yellow

  - name: 前走上がり順位
    source:
      type: prev_race_kohan_3f_rank
    color_rules:
      - condition:
          op: "=="
          value: 1
        color: yellow

  - name: 所属
    source:
      type: entry_field
      field: 所属コード
    display_map:
      "1": 美浦
      "2": 栗東
      "3": 地方
      "4": 海外
    color_rules:
      - condition:
          op: "=="
          value: "1"
        color: yellow

  - name: 馬齢
    source:
      type: entry_field
      field: 馬齢
    color_rules:
      - condition:
          op: "=="
          value: 4
        color: yellow

  - name: 性別
    source:
      type: entry_field
      field: 性別コード
    display_map:
      "1": 牡
      "2": 牝
      "3": セン
    color_rules:
      - condition:
          op: "=="
          value: "1"
        color: yellow

  - name: 前走レース
    source:
      type: prev_race_name
      overseas_label: 海外
    color_rules:
      - condition:
          op: in
          value: ["産経賞セントウルステークス", "キーンランドカップ", "テレビ西日本賞北九州記念", "安田記念"]
        color: yellow
      - condition:
          op: in
          value: ["アイビスサマーダッシュ"]
        color: gray

  - name: 前走クラス着順
    source:
      type: prev_race_grade_finish
    color_rules:
      - condition:
          op: grade_finish_within
          value: {G1: 18, G2: 1}
        color: yellow

  - name: 前走距離
    source:
      type: past_field
      field: 距離
    color_rules:
      - condition:
          op: ">"
          value: "1200"
        color: yellow
      - condition:
          op: "<"
          value: "1200"
        color: gray

  - name: 同年高松宮記念着順
    source:
      type: tokubetsu_race_finish
      tokubetsu_kyoso_bango: "0019"
      year_offset: 0
      absent_label: "-"
    color_rules:
      - condition:
          op: "<="
          value: 3
        color: yellow

  - name: リピーター
    source:
      type: tokubetsu_race_finish
      tokubetsu_kyoso_bango: "0016"
      year_offset: 1
      absent_label: "-"

  - name: 当週/1週前坂路ラスト2F24.0秒未満
    source:
      type: chokyo_match_days
      chokyo_condition:
        - {course: hanro, metric: gokei, furlong: 2, max_value: 239}
      days_from: 1
      days_to: 13
    color_rules:
      - condition:
          op: ">="
          value: 1
        color: yellow

