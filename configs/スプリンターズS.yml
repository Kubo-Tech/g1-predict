race_name: スプリンターズS

trends:
  出走馬傾向:
    - name: 枠順
      source: {type: gate_number}
      rows:
        type: fixed
        items:
          - {label: "1枠", op: "==", value: 1}
          - {label: "2枠", op: "==", value: 2}
          - {label: "3枠", op: "==", value: 3}
          - {label: "4枠", op: "==", value: 4}
          - {label: "5枠", op: "==", value: 5}
          - {label: "6枠", op: "==", value: 6}
          - {label: "7枠", op: "==", value: 7}
          - {label: "8枠", op: "==", value: 8}
    - name: 人気
      source: {type: popularity}
      rows:
        type: fixed
        items:
          - {label: "1人気", op: "==", value: 1}
          - {label: "2人気", op: "==", value: 2}
          - {label: "3人気", op: "==", value: 3}
          - {label: "4-6人気", op: "in", value: [4, 5, 6]}
          - {label: "7-9人気", op: "in", value: [7, 8, 9]}
          - {label: "10人気以下", op: ">=", value: 10}
    - name: 脚質
      source: {type: running_style}
      rows:
        type: fixed
        items:
          - {label: "逃げ", op: "==", value: "1"}
          - {label: "先行", op: "==", value: "2"}
          - {label: "差し", op: "==", value: "3"}
          - {label: "追込", op: "==", value: "4"}
    - name: 前走脚質
      source: {type: prev_race_col, column: kyakushitsu_hantei}
      rows:
        type: fixed
        items:
          - {label: "逃げ", op: "==", value: "1"}
          - {label: "先行", op: "==", value: "2"}
          - {label: "差し", op: "==", value: "3"}
          - {label: "追込", op: "==", value: "4"}
    - name: 上がり3F順位
      source: {type: agari_3f_rank}
      rows:
        type: fixed
        items:
          - {label: "1位", op: "==", value: 1}
          - {label: "2位", op: "==", value: 2}
          - {label: "3位", op: "==", value: 3}
          - {label: "4位以下", op: ">=", value: 4}
    - name: 前走上がり3F順位
      source: {type: prev_race_col, column: kohan_3f_jun}
      rows:
        type: fixed
        items:
          - {label: "1位", op: "==", value: 1}
          - {label: "2位", op: "==", value: 2}
          - {label: "3位", op: "==", value: 3}
          - {label: "4位以下", op: ">=", value: 4}
    - name: 所属
      source: {type: affiliation}
      rows:
        type: fixed
        items:
          - {label: "美浦", op: "==", value: 1}
          - {label: "栗東", op: "==", value: 2}
          - {label: "地方", op: "==", value: 3}
          - {label: "海外", op: "==", value: 4}
    - name: 馬齢
      source: {type: horse_age}
      rows:
        type: fixed
        items:
          - {label: "3歳", op: "==", value: 3}
          - {label: "4歳", op: "==", value: 4}
          - {label: "5歳", op: "==", value: 5}
          - {label: "6歳", op: "==", value: 6}
          - {label: "7歳以上", op: ">=", value: 7}
    - name: 性別
      source: {type: sex}
      rows:
        type: fixed
        items:
          - {label: "牡", op: "==", value: 1}
          - {label: "牝", op: "==", value: 2}
          - {label: "セン", op: "==", value: 3}
    - name: 前走レース
      source: {type: prev_race_name, overseas_label: 海外}
      rows:
        type: dynamic
        top_n: 5
        always_include_grades: ["A", "B", "C"]
    - name: 前走クラス
      source: {type: prev_race_grade}
      rows:
        type: fixed
        items:
          - {label: "G1", op: "==", value: "A"}
          - {label: "G2", op: "==", value: "B"}
          - {label: "G3", op: "==", value: "C"}
          - {label: "その他", op: "not_in", value: ["A", "B", "C"]}
    - name: 前走着順
      source: {type: prev_race_finish}
      rows:
        type: fixed
        items:
          - {label: "1着", op: "==", value: 1}
          - {label: "2着", op: "==", value: 2}
          - {label: "3着", op: "==", value: 3}
          - {label: "4着", op: "==", value: 4}
          - {label: "5着", op: "==", value: 5}
          - {label: "6-9着", op: "in", value: [6, 7, 8, 9]}
          - {label: "10着以下", op: ">=", value: 10}
    - name: 前走G1着順
      source: {type: prev_race_finish_by_grade, grade_codes: ["A"]}
      rows:
        type: fixed
        items:
          - {label: "1着", op: "==", value: 1}
          - {label: "2着", op: "==", value: 2}
          - {label: "3着", op: "==", value: 3}
          - {label: "4着", op: "==", value: 4}
          - {label: "5着", op: "==", value: 5}
          - {label: "6-9着", op: "in", value: [6, 7, 8, 9]}
          - {label: "10着以下", op: ">=", value: 10}
    - name: 前走G2着順
      source: {type: prev_race_finish_by_grade, grade_codes: ["B"]}
      rows:
        type: fixed
        items:
          - {label: "1着", op: "==", value: 1}
          - {label: "2着", op: "==", value: 2}
          - {label: "3着", op: "==", value: 3}
          - {label: "4着", op: "==", value: 4}
          - {label: "5着", op: "==", value: 5}
          - {label: "6-9着", op: "in", value: [6, 7, 8, 9]}
          - {label: "10着以下", op: ">=", value: 10}
    - name: 前走G3着順
      source: {type: prev_race_finish_by_grade, grade_codes: ["C"]}
      rows:
        type: fixed
        items:
          - {label: "1着", op: "==", value: 1}
          - {label: "2着", op: "==", value: 2}
          - {label: "3着", op: "==", value: 3}
          - {label: "4着", op: "==", value: 4}
          - {label: "5着", op: "==", value: 5}
          - {label: "6-9着", op: "in", value: [6, 7, 8, 9]}
          - {label: "10着以下", op: ">=", value: 10}
    - name: 前走非重賞着順
      source: {type: prev_race_finish_by_grade, exclude_grade_codes: ["A", "B", "C"]}
      rows:
        type: fixed
        items:
          - {label: "1着", op: "==", value: 1}
          - {label: "2着", op: "==", value: 2}
          - {label: "3着", op: "==", value: 3}
          - {label: "4着", op: "==", value: 4}
          - {label: "5着", op: "==", value: 5}
          - {label: "6-9着", op: "in", value: [6, 7, 8, 9]}
          - {label: "10着以下", op: ">=", value: 10}
    - name: 前走距離
      source: {type: prev_race_col, column: kyori}
      rows:
        type: fixed
        items:
          - {label: "距離延長", op: "<", value: 1200}
          - {label: "同距離", op: "==", value: 1200}
          - {label: "距離短縮", op: ">", value: 1200}
    - name: 中山重賞好走実績
      source:
        type: past_race_top_n_count
        keibajo_codes: ["06"]
        grade_codes: ["A", "B", "C"]
        top_n: 3
      rows:
        type: fixed
        items:
          - {label: "0回", op: "==", value: 0}
          - {label: "1回", op: "==", value: 1}
          - {label: "2回", op: "==", value: 2}
          - {label: "3回以上", op: ">=", value: 3}
    - name: リピーター
      source: {type: tokubetsu_race_finish, tokubetsu_kyoso_bango: "0016", year_offset: 1, absent_label: 前年出走無し}
      rows:
        type: fixed
        items:
          - {label: "前年3着以内", op: "<=", value: 3}
          - {label: "前年4着以内", op: "<=", value: 4}
          - {label: "前年5着以内", op: "<=", value: 5}
          - {label: "前年6着以下", op: ">=", value: 6}
          - {label: "前年出走無し", op: "==", value: "前年出走無し"}
    - name: 同年高松宮記念着順
      source:
        type: tokubetsu_race_finish
        tokubetsu_kyoso_bango: "0019"
        year_offset: 0
        absent_label: 出走無し
      rows:
        type: fixed
        items:
          - {label: "3着以内", op: "<=", value: 3}
          - {label: "4着以内", op: "<=", value: 4}
          - {label: "5着以内", op: "<=", value: 5}
          - {label: "6着以下", op: ">=", value: 6}
          - {label: "出走無し", op: "==", value: "出走無し"}
    - name: 当週/1週前坂路ラスト2F24.0秒未満
      source:
        type: chokyo_match_days
        chokyo_condition:
          - {course: hanro, metric: gokei, furlong: 2, max_value: 239}
        days_from: 1
        days_to: 13
      rows:
        type: fixed
        items:
          - {label: "該当", op: any_match}
          - {label: "非該当", op: none_match}
          - {label: "坂路記録なし", op: empty}
  騎手傾向:
    - name: 騎手
      source: {type: jockey_name}
      rows: {type: all_entries}
  生産者傾向:
    - name: 生産者
      source: {type: breeder_name}
      rows: {type: all_entries}
  血統傾向:
    - name: 種牡馬
      source: {type: sire_name}
      rows: {type: dynamic, top_n: 5}

table:
  出走馬:
    - name: 枠勝率
      source:
        type: waku_stat
        stat: win_rate
        keibajo_code: "06"
        track: shiba
        kyori: 1200
        years: 5
        week: 2
      color_rules:
        - condition:
            op: ">="
            value: 0.125
          color: yellow

    - name: 枠複勝率
      source:
        type: waku_stat
        stat: top3_rate
        keibajo_code: "06"
        track: shiba
        kyori: 1200
        years: 5
        week: 2
      color_rules:
        - condition:
            op: ">="
            value: 0.375
          color: yellow

    - name: 前走脚質
      source:
        type: recent_umagoto_field
        field: kyakushitsu
      color_rules:
        - condition:
            op: in
            value: ["逃", "先"]
          color: yellow

    - name: 前走上がり順位
      source:
        type: prev_race_kohan_3f_rank
      color_rules:
        - condition:
            op: "=="
            value: 1
          color: yellow

    - name: 所属
      source:
        type: entry_field
        field: 所属コード
      display_map:
        "1": 美浦
        "2": 栗東
        "3": 地方
        "4": 海外
      color_rules:
        - condition:
            op: "=="
            value: "1"
          color: yellow

    - name: 馬齢
      source:
        type: entry_field
        field: 馬齢
      color_rules:
        - condition:
            op: "=="
            value: 4
          color: yellow

    - name: 性別
      source:
        type: entry_field
        field: 性別コード
      display_map:
        "1": 牡
        "2": 牝
        "3": セン
      color_rules:
        - condition:
            op: "=="
            value: "1"
          color: yellow

    - name: 前走レース
      source:
        type: prev_race_name
        overseas_label: 海外
      color_rules:
        - condition:
            op: in
            value: ["産経賞セントウルステークス", "キーンランドカップ", "テレビ西日本賞北九州記念", "安田記念"]
          color: yellow
        - condition:
            op: in
            value: ["アイビスサマーダッシュ"]
          color: gray

    - name: 前走クラス着順
      source:
        type: prev_race_grade_finish
      color_rules:
        - condition:
            op: grade_finish_within
            value: {G1: 18, G2: 1}
          color: yellow

    - name: 前走距離
      source:
        type: past_field
        field: 距離
      color_rules:
        - condition:
            op: ">"
            value: "1200"
          color: yellow
        - condition:
            op: "<"
            value: "1200"
          color: gray

    - name: 同年高松宮記念着順
      source:
        type: tokubetsu_race_finish
        tokubetsu_kyoso_bango: "0019"
        year_offset: 0
        absent_label: "-"
      color_rules:
        - condition:
            op: "<="
            value: 3
          color: yellow

    - name: リピーター
      source:
        type: tokubetsu_race_finish
        tokubetsu_kyoso_bango: "0016"
        year_offset: 1
        absent_label: "-"

    - name: 当週/1週前坂路ラスト2F24.0秒未満
      source:
        type: chokyo_match_days
        chokyo_condition:
          - {course: hanro, metric: gokei, furlong: 2, max_value: 239}
        days_from: 1
        days_to: 13
      color_rules:
        - condition:
            op: ">="
            value: 1
          color: yellow

  騎手:
    - name: 騎手名
      source:
        type: entry_field
        field: 騎手名略称

    - name: コース勝率
      source:
        type: kishu_course_stat
        stat: win_rate
        keibajo_code: "06"
        track: shiba
        kyori: 1200
        years: 5
      color_rules:
        - condition:
            op: ">="
            value: 0.15
          color: yellow

    - name: コース勝利数
      source:
        type: kishu_course_stat
        stat: wins
        keibajo_code: "06"
        track: shiba
        kyori: 1200
        years: 5
      color_rules:
        - condition:
            op: ">="
            value: 5
          color: yellow

    - name: コース複勝率
      source:
        type: kishu_course_stat
        stat: top3_rate
        keibajo_code: "06"
        track: shiba
        kyori: 1200
        years: 5
      color_rules:
        - condition:
            op: ">="
            value: 0.30
          color: yellow

    - name: コース3着内数
      source:
        type: kishu_course_stat
        stat: top3
        keibajo_code: "06"
        track: shiba
        kyori: 1200
        years: 5
      color_rules:
        - condition:
            op: ">="
            value: 15
          color: yellow

  生産者:
    - name: 生産者名
      source:
        type: kyosoba_field
        field: seisanshamei_hojinkaku_nashi

    - name: スプリンターズS勝率
      source:
        type: seisansha_race_stat
        stat: win_rate
        race_name_for_history: スプリンターズステークス
        years: 10
      color_rules:
        - condition:
            op: ">="
            value: 0.05
          color: yellow

    - name: スプリンターズS勝利数
      source:
        type: seisansha_race_stat
        stat: wins
        race_name_for_history: スプリンターズステークス
        years: 10
      color_rules:
        - condition:
            op: ">="
            value: 1
          color: yellow

    - name: スプリンターズS複勝率
      source:
        type: seisansha_race_stat
        stat: top3_rate
        race_name_for_history: スプリンターズステークス
        years: 10
      color_rules:
        - condition:
            op: ">="
            value: 0.20
          color: yellow

    - name: スプリンターズS3着内数
      source:
        type: seisansha_race_stat
        stat: top3
        race_name_for_history: スプリンターズステークス
        years: 10
      color_rules:
        - condition:
            op: ">="
            value: 1
          color: yellow

  種牡馬:
    - name: 種牡馬名
      source:
        type: sire_race_stat
        stat: name

    - name: 産駒コース勝率
      source:
        type: sire_course_stat
        stat: win_rate
        keibajo_code: "06"
        track: shiba
        kyori: 1200
        years: 5
        track_condition: "1"
      color_rules:
        - condition:
            op: ">="
            value: 0.10
          color: yellow

    - name: 産駒コース勝利数
      source:
        type: sire_course_stat
        stat: wins
        keibajo_code: "06"
        track: shiba
        kyori: 1200
        years: 5
        track_condition: "1"
      color_rules:
        - condition:
            op: ">="
            value: 5
          color: yellow

    - name: 産駒コース複勝率
      source:
        type: sire_course_stat
        stat: top3_rate
        keibajo_code: "06"
        track: shiba
        kyori: 1200
        years: 5
        track_condition: "1"
      color_rules:
        - condition:
            op: ">="
            value: 0.30
          color: yellow

    - name: 産駒コース3着内数
      source:
        type: sire_course_stat
        stat: top3
        keibajo_code: "06"
        track: shiba
        kyori: 1200
        years: 5
        track_condition: "1"
      color_rules:
        - condition:
            op: ">="
            value: 15
          color: yellow

    - name: 産駒スプリンターズS勝率
      source:
        type: sire_race_stat
        stat: win_rate
        race_name_for_history: スプリンターズステークス
        years: 10
      color_rules:
        - condition:
            op: ">="
            value: 0.05
          color: yellow

    - name: 産駒スプリンターズS勝利数
      source:
        type: sire_race_stat
        stat: wins
        race_name_for_history: スプリンターズステークス
        years: 10
      color_rules:
        - condition:
            op: ">="
            value: 1
          color: yellow

    - name: 産駒スプリンターズS複勝率
      source:
        type: sire_race_stat
        stat: top3_rate
        race_name_for_history: スプリンターズステークス
        years: 10
      color_rules:
        - condition:
            op: ">="
            value: 0.20
          color: yellow

    - name: 産駒スプリンターズS3着内数
      source:
        type: sire_race_stat
        stat: top3
        race_name_for_history: スプリンターズステークス
        years: 10
      color_rules:
        - condition:
            op: ">="
            value: 1
          color: yellow
