出走馬:
  - name: 枠勝率
    source:
      type: waku_stat
      stat: win_rate
      keibajo_code: "09"
      track: shiba
      kyori: 2200
      years: 5
      course_kubun: "B"
      week: 2
    color_rules:
      - condition:
          op: ">="
          value: 0.125
        color: yellow

  - name: 枠複勝率
    source:
      type: waku_stat
      stat: top3_rate
      keibajo_code: "09"
      track: shiba
      kyori: 2200
      years: 5
      course_kubun: "B"
      week: 2
    color_rules:
      - condition:
          op: ">="
          value: 0.375
        color: yellow

  - name: 前走脚質
    source:
      type: recent_umagoto_field
      field: kyakushitsu
    color_rules:
      - condition:
          op: "=="
          value: "差"
        color: yellow

  - name: 前走上がり順位
    source:
      type: prev_race_kohan_3f_rank
    color_rules:
      - condition:
          op: in
          value: [1, 2, 3]
        color: yellow

  - name: 所属
    source:
      type: entry_field
      field: 所属コード
    display_map:
      "1": 美浦
      "2": 栗東
      "3": 地方
      "4": 海外
    color_rules:
      - condition:
          op: "=="
          value: "2"
        color: yellow

  - name: 馬齢
    source:
      type: entry_field
      field: 馬齢
    color_rules:
      - condition:
          op: in
          value: [4, 5]
        color: yellow

  - name: 性別
    source:
      type: entry_field
      field: 性別コード
    display_map:
      "1": 牡
      "2": 牝
      "3": セン
    color_rules:
      - condition:
          op: "=="
          value: "2"
        color: yellow

  - name: 前走レース
    source:
      type: prev_race_name
      overseas_label: 海外
    color_rules:
      - condition:
          op: in
          value: ["天皇賞（春）", "海外", "大阪杯"]
        color: yellow
      - condition:
          op: "=="
          value: "有馬記念"
        color: gray

  - name: 前走クラス着順
    source:
      type: prev_race_grade_finish
    color_rules:
      - condition:
          op: grade_finish_within
          value: {G1: 9, G2: 2, G3: 1}
        color: yellow

  - name: 前走距離
    source:
      type: past_field
      field: 距離
    color_rules:
      - condition:
          op: ">"
          value: "2200"
        color: yellow

