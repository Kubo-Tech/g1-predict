race_name: 宝塚記念

trends:
  出走馬傾向:
    - name: 枠順
      condition:
        years: 10
        keibajo_codes: ["09"]
        kaisai_nichime: [4]
        babajotai_codes: ["1"]
      source: {type: gate_number}
      rows:
        type: fixed
        items:
          - {label: "1枠", op: "==", value: 1}
          - {label: "2枠", op: "==", value: 2}
          - {label: "3枠", op: "==", value: 3}
          - {label: "4枠", op: "==", value: 4}
          - {label: "5枠", op: "==", value: 5}
          - {label: "6枠", op: "==", value: 6}
          - {label: "7枠", op: "==", value: 7}
          - {label: "8枠", op: "==", value: 8}
    - name: 人気
      condition:
        years: 10
        keibajo_codes: ["09"]
      source: {type: popularity}
      rows:
        type: fixed
        items:
          - {label: "1人気", op: "==", value: 1}
          - {label: "2人気", op: "==", value: 2}
          - {label: "3人気", op: "==", value: 3}
          - {label: "4-6人気", op: "in", value: [4, 5, 6]}
          - {label: "7-9人気", op: "in", value: [7, 8, 9]}
          - {label: "10人気以下", op: ">=", value: 10}
    - name: 脚質
      condition:
        years: 10
        keibajo_codes: ["09"]
        kaisai_nichime: [4]
        babajotai_codes: ["1"]
      source: {type: running_style}
      rows:
        type: fixed
        items:
          - {label: "逃げ", op: "==", value: "1"}
          - {label: "先行", op: "==", value: "2"}
          - {label: "差し", op: "==", value: "3"}
          - {label: "追込", op: "==", value: "4"}
    - name: 前走脚質
      condition:
        years: 10
        keibajo_codes: ["09"]
        kaisai_nichime: [4]
        babajotai_codes: ["1"]
      source: {type: prev_race_col, column: kyakushitsu_hantei}
      rows:
        type: fixed
        items:
          - {label: "逃げ", op: "==", value: "1"}
          - {label: "先行", op: "==", value: "2"}
          - {label: "差し", op: "==", value: "3"}
          - {label: "追込", op: "==", value: "4"}
    - name: 上がり3F順位
      condition:
        years: 10
        keibajo_codes: ["09"]
        kaisai_nichime: [4]
        babajotai_codes: ["1"]
      source: {type: agari_3f_rank}
      rows:
        type: fixed
        items:
          - {label: "1位", op: "==", value: 1}
          - {label: "2位", op: "==", value: 2}
          - {label: "3位", op: "==", value: 3}
          - {label: "4位以下", op: ">=", value: 4}
    - name: 前走上がり3F順位
      condition:
        years: 10
        keibajo_codes: ["09"]
        kaisai_nichime: [4]
        babajotai_codes: ["1"]
      source: {type: prev_race_col, column: kohan_3f_jun}
      rows:
        type: fixed
        items:
          - {label: "1位", op: "==", value: 1}
          - {label: "2位", op: "==", value: 2}
          - {label: "3位", op: "==", value: 3}
          - {label: "4位以下", op: ">=", value: 4}
    - name: 所属
      condition:
        years: 10
        keibajo_codes: ["09"]
      source: {type: affiliation}
      rows:
        type: fixed
        items:
          - {label: "美浦", op: "==", value: 1}
          - {label: "栗東", op: "==", value: 2}
          - {label: "地方", op: "==", value: 3}
          - {label: "海外", op: "==", value: 4}
    - name: 馬齢
      condition:
        years: 10
        keibajo_codes: ["09"]
      source: {type: horse_age}
      rows:
        type: fixed
        items:
          - {label: "3歳", op: "==", value: 3}
          - {label: "4歳", op: "==", value: 4}
          - {label: "5歳", op: "==", value: 5}
          - {label: "6歳", op: "==", value: 6}
          - {label: "7歳以上", op: ">=", value: 7}
    - name: 性別
      condition:
        years: 10
        keibajo_codes: ["09"]
      source: {type: sex}
      rows:
        type: fixed
        items:
          - {label: "牡", op: "==", value: 1}
          - {label: "牝", op: "==", value: 2}
          - {label: "セン", op: "==", value: 3}
    - name: 前走レース
      condition:
        years: 10
        keibajo_codes: ["09"]
      source: {type: prev_race_name, overseas_label: 海外}
      rows:
        type: dynamic
        top_n: 5
        always_include_grades: ["A", "B", "C"]
    - name: 前走クラス
      condition:
        years: 10
        keibajo_codes: ["09"]
      source: {type: prev_race_grade}
      rows:
        type: fixed
        items:
          - {label: "G1", op: "==", value: "A"}
          - {label: "G2", op: "==", value: "B"}
          - {label: "G3", op: "==", value: "C"}
          - {label: "その他", op: "not_in", value: ["A", "B", "C"]}
    - name: 前走着順
      condition:
        years: 10
        keibajo_codes: ["09"]
      source: {type: prev_race_finish}
      rows:
        type: fixed
        items:
          - {label: "1着", op: "==", value: 1}
          - {label: "2着", op: "==", value: 2}
          - {label: "3着", op: "==", value: 3}
          - {label: "4着", op: "==", value: 4}
          - {label: "5着", op: "==", value: 5}
          - {label: "6-9着", op: "in", value: [6, 7, 8, 9]}
          - {label: "10着以下", op: ">=", value: 10}
    - name: 前走G1着順
      condition:
        years: 10
        keibajo_codes: ["09"]
      source: {type: prev_race_finish_by_grade, grade_codes: ["A"]}
      rows:
        type: fixed
        items:
          - {label: "1着", op: "==", value: 1}
          - {label: "2着", op: "==", value: 2}
          - {label: "3着", op: "==", value: 3}
          - {label: "4着", op: "==", value: 4}
          - {label: "5着", op: "==", value: 5}
          - {label: "6-9着", op: "in", value: [6, 7, 8, 9]}
          - {label: "10着以下", op: ">=", value: 10}
    - name: 前走G2着順
      condition:
        years: 10
        keibajo_codes: ["09"]
      source: {type: prev_race_finish_by_grade, grade_codes: ["B"]}
      rows:
        type: fixed
        items:
          - {label: "1着", op: "==", value: 1}
          - {label: "2着", op: "==", value: 2}
          - {label: "3着", op: "==", value: 3}
          - {label: "4着", op: "==", value: 4}
          - {label: "5着", op: "==", value: 5}
          - {label: "6-9着", op: "in", value: [6, 7, 8, 9]}
          - {label: "10着以下", op: ">=", value: 10}
    - name: 前走G3着順
      condition:
        years: 10
        keibajo_codes: ["09"]
      source: {type: prev_race_finish_by_grade, grade_codes: ["C"]}
      rows:
        type: fixed
        items:
          - {label: "1着", op: "==", value: 1}
          - {label: "2着", op: "==", value: 2}
          - {label: "3着", op: "==", value: 3}
          - {label: "4着", op: "==", value: 4}
          - {label: "5着", op: "==", value: 5}
          - {label: "6-9着", op: "in", value: [6, 7, 8, 9]}
          - {label: "10着以下", op: ">=", value: 10}
    - name: 前走非重賞着順
      condition:
        years: 10
        keibajo_codes: ["09"]
      source: {type: prev_race_finish_by_grade, exclude_grade_codes: ["A", "B", "C"]}
      rows:
        type: fixed
        items:
          - {label: "1着", op: "==", value: 1}
          - {label: "2着", op: "==", value: 2}
          - {label: "3着", op: "==", value: 3}
          - {label: "4着", op: "==", value: 4}
          - {label: "5着", op: "==", value: 5}
          - {label: "6-9着", op: "in", value: [6, 7, 8, 9]}
          - {label: "10着以下", op: ">=", value: 10}
    - name: 前走距離
      condition:
        years: 10
        keibajo_codes: ["09"]
      source: {type: prev_race_col, column: kyori}
      rows:
        type: fixed
        items:
          - {label: "距離延長", op: "<", value: 2200}
          - {label: "同距離", op: "==", value: 2200}
          - {label: "距離短縮", op: ">", value: 2200}
    - name: 阪神重賞好走実績
      condition:
        years: 10
        keibajo_codes: ["09"]
      source:
        type: past_race_top_n_count
        keibajo_codes: ["09"]
        grade_codes: ["A", "B", "C"]
        top_n: 3
      rows:
        type: fixed
        items:
          - {label: "0回", op: "==", value: 0}
          - {label: "1回", op: "==", value: 1}
          - {label: "2回", op: "==", value: 2}
          - {label: "3回以上", op: ">=", value: 3}
  騎手傾向:
    - name: 騎手
      condition:
        years: 10
        keibajo_codes: ["09"]
      source: {type: jockey_name}
      rows: {type: all_entries}
  生産者傾向:
    - name: 生産者
      condition:
        years: 10
        keibajo_codes: ["09"]
      source: {type: breeder_name}
      rows: {type: all_entries}
  血統傾向:
    - name: 種牡馬
      condition:
        years: 10
        keibajo_codes: ["09"]
      source: {type: sire_name}
      rows: {type: dynamic, top_n: 5}

table:
  出走馬:
    - name: 枠勝率
      source:
        type: waku_stat
        stat: win_rate
        keibajo_code: "09"
        track: shiba
        kyori: 2200
        years: 5
        course_kubun: "B"
        week: 2
      color_rules:
        - condition:
            op: ">="
            value: 0.125
          color: yellow

    - name: 枠複勝率
      source:
        type: waku_stat
        stat: top3_rate
        keibajo_code: "09"
        track: shiba
        kyori: 2200
        years: 5
        course_kubun: "C"
        week: 2
      color_rules:
        - condition:
            op: ">="
            value: 0.375
          color: yellow

    - name: 前走脚質
      source:
        type: recent_umagoto_field
        field: kyakushitsu
      color_rules:
        - condition:
            op: "=="
            value: "差"
          color: yellow

    - name: 前走上がり順位
      source:
        type: prev_race_kohan_3f_rank
      color_rules:
        - condition:
            op: in
            value: [1, 2, 3]
          color: yellow

    - name: 所属
      source:
        type: entry_field
        field: 所属コード
      display_map:
        "1": 美浦
        "2": 栗東
        "3": 地方
        "4": 海外
      color_rules:
        - condition:
            op: "=="
            value: "2"
          color: yellow

    - name: 馬齢
      source:
        type: entry_field
        field: 馬齢
      color_rules:
        - condition:
            op: in
            value: [4, 5]
          color: yellow

    - name: 性別
      source:
        type: entry_field
        field: 性別コード
      display_map:
        "1": 牡
        "2": 牝
        "3": セン
      color_rules:
        - condition:
            op: "=="
            value: "2"
          color: yellow

    - name: 前走レース
      source:
        type: prev_race_name
        overseas_label: 海外
      color_rules:
        - condition:
            op: in
            value: ["天皇賞（春）", "海外", "大阪杯"]
          color: yellow
        - condition:
            op: "=="
            value: "有馬記念"
          color: gray

    - name: 前走クラス着順
      source:
        type: prev_race_grade_finish
      color_rules:
        - condition:
            op: grade_finish_within
            value: {G1: 9, G2: 2, G3: 1}
          color: yellow

    - name: 前走距離
      source:
        type: past_field
        field: 距離
      color_rules:
        - condition:
            op: ">"
            value: "2200"
          color: yellow

  騎手:
    - name: 騎手名
      source:
        type: entry_field
        field: 騎手名略称

    - name: コース勝率
      source:
        type: kishu_course_stat
        stat: win_rate
        keibajo_code: "09"
        track: shiba
        kyori: 2200
        years: 5
      color_rules:
        - condition:
            op: ">="
            value: 0.15
          color: yellow

    - name: コース勝利数
      source:
        type: kishu_course_stat
        stat: wins
        keibajo_code: "09"
        track: shiba
        kyori: 2200
        years: 5
      color_rules:
        - condition:
            op: ">="
            value: 10
          color: yellow

    - name: コース複勝率
      source:
        type: kishu_course_stat
        stat: top3_rate
        keibajo_code: "09"
        track: shiba
        kyori: 2200
        years: 5
      color_rules:
        - condition:
            op: ">="
            value: 0.30
          color: yellow

    - name: コース3着内数
      source:
        type: kishu_course_stat
        stat: top3
        keibajo_code: "09"
        track: shiba
        kyori: 2200
        years: 5
      color_rules:
        - condition:
            op: ">="
            value: 30
          color: yellow

  生産者:
    - name: 生産者名
      source:
        type: kyosoba_field
        field: seisanshamei_hojinkaku_nashi

    - name: 宝塚記念勝率
      source:
        type: seisansha_race_stat
        stat: win_rate
        race_name_for_history: 宝塚記念
        years: 10
      color_rules:
        - condition:
            op: ">="
            value: 0.05
          color: yellow

    - name: 宝塚記念勝利数
      source:
        type: seisansha_race_stat
        stat: wins
        race_name_for_history: 宝塚記念
        years: 10
      color_rules:
        - condition:
            op: ">="
            value: 1
          color: yellow

    - name: 宝塚記念複勝率
      source:
        type: seisansha_race_stat
        stat: top3_rate
        race_name_for_history: 宝塚記念
        years: 10
      color_rules:
        - condition:
            op: ">="
            value: 0.20
          color: yellow

    - name: 宝塚記念3着内数
      source:
        type: seisansha_race_stat
        stat: top3
        race_name_for_history: 宝塚記念
        years: 10
      color_rules:
        - condition:
            op: ">="
            value: 1
          color: yellow

  種牡馬:
    - name: 種牡馬名
      source:
        type: sire_race_stat
        stat: name

    - name: 産駒コース勝率
      source:
        type: sire_course_stat
        stat: win_rate
        keibajo_code: "09"
        track: shiba
        kyori: 2200
        years: 5
        track_condition: "1"
      color_rules:
        - condition:
            op: ">="
            value: 0.10
          color: yellow

    - name: 産駒コース勝利数
      source:
        type: sire_course_stat
        stat: wins
        keibajo_code: "09"
        track: shiba
        kyori: 2200
        years: 5
        track_condition: "1"
      color_rules:
        - condition:
            op: ">="
            value: 3
          color: yellow

    - name: 産駒コース複勝率
      source:
        type: sire_course_stat
        stat: top3_rate
        keibajo_code: "09"
        track: shiba
        kyori: 2200
        years: 5
        track_condition: "1"
      color_rules:
        - condition:
            op: ">="
            value: 0.30
          color: yellow

    - name: 産駒コース3着内数
      source:
        type: sire_course_stat
        stat: top3
        keibajo_code: "09"
        track: shiba
        kyori: 2200
        years: 5
        track_condition: "1"
      color_rules:
        - condition:
            op: ">="
            value: 5
          color: yellow

    - name: 産駒宝塚記念勝率
      source:
        type: sire_race_stat
        stat: win_rate
        race_name_for_history: 宝塚記念
        years: 10
      color_rules:
        - condition:
            op: ">="
            value: 0.05
          color: yellow

    - name: 産駒宝塚記念勝利数
      source:
        type: sire_race_stat
        stat: wins
        race_name_for_history: 宝塚記念
        years: 10
      color_rules:
        - condition:
            op: ">="
            value: 1
          color: yellow

    - name: 産駒宝塚記念複勝率
      source:
        type: sire_race_stat
        stat: top3_rate
        race_name_for_history: 宝塚記念
        years: 10
      color_rules:
        - condition:
            op: ">="
            value: 0.20
          color: yellow

    - name: 産駒宝塚記念3着内数
      source:
        type: sire_race_stat
        stat: top3
        race_name_for_history: 宝塚記念
        years: 10
      color_rules:
        - condition:
            op: ">="
            value: 1
          color: yellow