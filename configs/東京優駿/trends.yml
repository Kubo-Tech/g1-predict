出走馬傾向:
  - name: 勝利数
    source:
      type: past_race_top_n_count
      top_n: 1
    rows:
      type: fixed
      items:
        - {label: "0勝", op: "==", value: 0}
        - {label: "1勝", op: "==", value: 1}
        - {label: "2勝", op: "==", value: 2}
        - {label: "3勝以上", op: ">=", value: 3}
  - name: 重賞勝利数
    source:
      type: past_race_top_n_count
      grade_codes: ["A", "B", "C"]
      top_n: 1
    rows:
      type: fixed
      items:
        - {label: "0勝", op: "==", value: 0}
        - {label: "1勝", op: "==", value: 1}
        - {label: "2勝以上", op: ">=", value: 2}
  - name: 東京勝利数
    source:
      type: past_race_top_n_count
      keibajo_codes: ["05"]
      top_n: 1
    rows:
      type: fixed
      items:
        - {label: "0勝", op: "==", value: 0}
        - {label: "1勝", op: "==", value: 1}
        - {label: "2勝以上", op: ">=", value: 2}
  - name: 前走レース
    source:
      type: prev_race_name
    rows:
      type: dynamic
      top_n: 5
  - name: デビュー
    source:
      type: debut_venue
      allowed_values: ["01", "02", "03", "04", "05", "06", "07", "08", "09", "10"]
    display_map:
      "01": 札幌
      "02": 函館
      "03": 福島
      "04": 新潟
      "05": 東京
      "06": 中山
      "07": 中京
      "08": 京都
      "09": 阪神
      "10": 小倉
    rows:
      type: dynamic
  - name: キャリア
    source:
      type: career_count
    rows:
      type: fixed
      items:
        - {label: "2戦以下", op: "<=", value: 2}
        - {label: "3戦", op: "==", value: 3}
        - {label: "4戦", op: "==", value: 4}
        - {label: "5戦", op: "==", value: 5}
        - {label: "6戦", op: "==", value: 6}
        - {label: "7戦以上", op: ">=", value: 7}
  - name: 枠順
    source:
      type: gate_number
    rows:
      type: fixed
      items:
        - {label: "1枠", op: "==", value: 1}
        - {label: "2枠", op: "==", value: 2}
        - {label: "3枠", op: "==", value: 3}
        - {label: "4枠", op: "==", value: 4}
        - {label: "5枠", op: "==", value: 5}
        - {label: "6枠", op: "==", value: 6}
        - {label: "7枠", op: "==", value: 7}
        - {label: "8枠", op: "==", value: 8}
  - name: 人気
    source:
      type: popularity
    rows:
      type: fixed
      items:
        - {label: "1人気", op: "==", value: 1}
        - {label: "2人気", op: "==", value: 2}
        - {label: "3人気", op: "==", value: 3}
        - {label: "4-6人気", op: "in", value: [4, 5, 6]}
        - {label: "7-9人気", op: "in", value: [7, 8, 9]}
        - {label: "10人気以下", op: ">=", value: 10}
  - name: 脚質
    source:
      type: running_style
    rows:
      type: fixed
      items:
        - {label: "逃げ", op: "==", value: "1"}
        - {label: "先行", op: "==", value: "2"}
        - {label: "差し", op: "==", value: "3"}
        - {label: "追込", op: "==", value: "4"}
騎手傾向:
  - name: 継続騎乗
    source:
      type: jockey_continuity
    rows:
      type: fixed
      items:
        - {label: "継続騎乗", op: "==", value: "継続"}
        - {label: "乗り戻り", op: "==", value: "乗り戻り"}
        - {label: "テン乗り", op: "==", value: "テン乗り"}
  - name: 騎手
    source:
      type: jockey_name
    rows:
      type: dynamic
      top_n: 5
生産者傾向:
  - name: 生産者
    source:
      type: breeder_name
    rows:
      type: dynamic
      top_n: 5
血統傾向:
  - name: 父実績
    rows:
      type: boolean_multi
      items:
        - label: "父ダービー勝ち"
          source:
            type: sire_race_condition_finisher
            race_name: "東京優駿"
            years: 30
        - label: "父2400mG1勝ち"
          source:
            type: sire_race_condition_finisher
            grade_codes: ["A"]
            kyori: 2400
            years: 30
  - name: 種牡馬
    source:
      type: sire_name
    rows:
      type: dynamic
      top_n: 5
