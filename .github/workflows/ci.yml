name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'g1_predict/**'
      - 'scripts/**'
      - 'test/**'
      - 'configs/**'
      - 'pyproject.toml'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'g1_predict/**'
      - 'scripts/**'
      - 'test/**'
      - 'configs/**'
      - 'pyproject.toml'
      - '.github/workflows/ci.yml'

env:
  # KeibaAI共通のlibrary-workflowと同じ版に揃える。版がずれると同じコードでも
  # 判定結果が変わるため、ここで固定する。
  RUFF_VERSION: '0.16.3'

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # setup-uvはv8以降メジャータグを提供していないため完全なコミットSHAで固定する。
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.11.19'
          python-version: '3.12'
          enable-cache: true
          cache-suffix: g1-predict

      # ruffはASTだけで動き依存の解決を必要としないため、インストールを待たずに先に流す。
      - name: Run ruff
        run: |
          echo "::group::ruff check"
          uvx "ruff@$RUFF_VERSION" check g1_predict/ scripts/ test/ --output-format=github
          echo "::endgroup::"

      - name: Create virtual environment
        run: |
          uv venv --python 3.12
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: uv pip install -e ".[dev]"

      - name: Run mypy
        run: |
          echo "::group::mypy check"
          mypy g1_predict/ scripts/
          echo "::endgroup::"

      - name: Run unit test
        run: pytest test/unit
